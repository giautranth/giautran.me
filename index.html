<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>giautran.me | Website Đang Nâng Cấp</title>
  <meta name="description" content="Website giautran.me đang cập nhật & nâng cấp giao diện mới." />
  <link rel="icon" type="image/png" href="https://api.iconify.design/lucide:sparkles.svg?color=%2338bdf8" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #070a13;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 2.5rem 2rem 2rem 2rem;
    }

    /* Ambient background lighting */
    .ambient-glow {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(99, 102, 241, 0.06) 40%, transparent 70%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-glow-bottom {
      position: fixed;
      bottom: -25%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, transparent 70%);
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }

    /* Subtle grid overlay */
    .grid-pattern {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Top brand header */
    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-decoration: none;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: #38bdf8;
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      font-size: 0.8rem;
      font-weight: 600;
      color: #34d399;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      position: relative;
    }

    .pulse-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: #10b981;
      opacity: 0.6;
      animation: pulse 2s infinite ease-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 900px;
      text-align: center;
      margin: auto;
      padding: 3rem 1rem;
      position: relative;
      z-index: 10;
    }

    .maintenance-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      font-size: 0.82rem;
      font-weight: 600;
      color: #7dd3fc;
      margin-bottom: 2rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(1.9rem, 4.2vw, 3.2rem);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      h1 {
        white-space: normal;
        font-size: 2rem;
      }
    }

    h1 span {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      font-size: clamp(1rem, 2vw, 1.15rem);
      color: var(--text-secondary);
      line-height: 1.75;
      max-width: 640px;
      margin: 0 auto;
      font-weight: 400;
    }

    .desktop-br {
      display: inline;
    }

    @media (max-width: 640px) {
      .desktop-br {
        display: none;
      }
    }

    /* Footer */
    footer {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.85rem;
      color: #64748b;
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>
  <div class="ambient-glow-bottom"></div>
  <div class="grid-pattern"></div>

  <!-- Header -->
  <header>
    <a href="/" class="brand-logo">
      <div class="brand-badge">GT</div>
      <span>giautran.me</span>
    </a>

    <div class="live-status">
      <span class="pulse-dot"></span>
      <span>Hệ thống trực tuyến</span>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="maintenance-tag">
      <span>🚀 Nâng Cấp Hệ Thống &amp; Giao Diện Mới</span>
    </div>

    <h1>Website Đang <span>Cập Nhật &amp; Nâng Cấp</span></h1>

    <p class="description">
      Hệ thống đang được nâng cấp toàn diện và sẽ sớm ra mắt với diện mạo mới.<br class="desktop-br" />
      Xin cảm ơn sự quan tâm và kiên nhẫn của bạn!
    </p>
  </main>

  <!-- Footer -->
  <footer>
    <div>&copy; 2026 giautran.me &bull; All rights reserved</div>
  </footer>

</body>
</html>
