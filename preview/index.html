<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview — giautran.me Responsive Preview (Mobile / Tablet / Desktop)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23000050'/%3E%3Ccircle cx='12' cy='20' r='3' fill='%23ffffff'/%3E%3Ccircle cx='20' cy='12' r='3' fill='%23ffffff'/%3E%3Ccircle cx='20' cy='20' r='4.2' fill='%23B1FD43'/%3E%3Ccircle cx='20' cy='28' r='3' fill='%23ffffff'/%3E%3Ccircle cx='28' cy='20' r='3' fill='%235465FF'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0a0a12;
      color: #f4f4f5;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ═══ TOP BAR ═══ */
    .stitch-topbar {
      height: 56px;
      background: #0a0a12;
      border-bottom: 1px solid #1e1e2e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 100;
    }

    .stitch-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stitch-logo-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stitch-logo-text .gt-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #B1FD43;
      display: inline-block;
      box-shadow: 0 0 8px rgba(177, 253, 67, 0.45);
    }

    .stitch-beta-badge {
      font-size: 0.62rem;
      font-weight: 700;
      color: #B1FD43;
      border: 1px solid rgba(177, 253, 67, 0.35);
      border-radius: 99px;
      padding: 2px 8px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .stitch-dropdown {
      position: relative;
      margin-left: 12px;
    }

    .stitch-page-select {
      background: #12121c;
      color: #e4e4e7;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 230px;
      justify-content: space-between;
    }

    .stitch-page-select:hover,
    .stitch-dropdown.open .stitch-page-select {
      border-color: #5465FF;
      background: #181828;
    }

    .stitch-page-select__left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stitch-page-select__left svg,
    .stitch-dropdown__item svg {
      width: 15px;
      height: 15px;
      color: #71717a;
      flex-shrink: 0;
      transition: color 0.15s ease;
    }

    .stitch-dropdown__arrow {
      width: 14px;
      height: 14px;
      color: #71717a;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .stitch-dropdown.open .stitch-dropdown__arrow {
      transform: rotate(180deg);
    }

    .stitch-dropdown__menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 260px;
      background: #111120;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      padding: 5px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      z-index: 300;
      max-height: 420px;
      overflow-y: auto;
    }

    .stitch-dropdown.open .stitch-dropdown__menu {
      display: block;
    }

    .stitch-dropdown__item {
      width: 100%;
      background: transparent;
      border: none;
      color: #d4d4d8;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 8px 10px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .stitch-dropdown__item:hover {
      background: #1c1c30;
      color: #ffffff;
    }

    .stitch-dropdown__item:hover svg {
      color: #e4e4e7;
    }

    .stitch-dropdown__item.active {
      background: #000050;
      color: #ffffff;
    }

    .stitch-dropdown__item.active svg {
      color: #B1FD43;
    }

    /* ═══ CENTER CONTROLS ═══ */
    .stitch-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stitch-device-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stitch-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #71717a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
    }

    .stitch-icon-btn:hover {
      background: #1c1c30;
      color: #ffffff;
    }

    .stitch-icon-btn.active {
      background: #B1FD43;
      color: #000050;
      box-shadow: 0 2px 12px rgba(177, 253, 67, 0.3);
    }

    .stitch-divider {
      width: 1px;
      height: 20px;
      background: #1e1e2e;
      margin: 0 8px;
    }

    .stitch-dim-badge {
      font-size: 0.75rem;
      color: #5465FF;
      background: #0e0e1a;
      border: 1px solid #1e1e2e;
      padding: 4px 10px;
      border-radius: 6px;
      margin-left: 6px;
      font-variant-numeric: tabular-nums;
    }

    /* ═══ RIGHT ACTIONS ═══ */
    .stitch-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stitch-share-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #000050;
      color: #B1FD43;
      border: 1px solid rgba(177, 253, 67, 0.3);
      border-radius: 99px;
      padding: 7px 16px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .stitch-share-btn:hover {
      background: #000070;
      border-color: #B1FD43;
      color: #ffffff;
    }

    /* ═══ DOTTED WORKSPACE CANVAS ═══ */
    .stitch-canvas {
      flex: 1;
      width: 100%;
      background-color: #08080f;
      background-image: radial-gradient(rgba(84, 101, 255, 0.2) 1.15px, transparent 1.15px);
      background-size: 22px 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 24px;
      position: relative;
    }

    /* ═══ DEVICE FRAME BEZEL ═══ */
    .device-bezel {
      position: relative;
      background: #ffffff;
      transition: width 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                  height 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                  border-radius 0.32s ease,
                  border-width 0.32s ease;
      box-shadow: 0 30px 80px rgba(0, 0, 80, 0.55),
                  0 0 0 1px rgba(84, 101, 255, 0.15);
      overflow: hidden;
      flex-shrink: 0;
    }

    /* MOBILE MODE (390 x 844) */
    .device-bezel[data-device="mobile"] {
      width: 414px;
      height: min(868px, calc(100vh - 96px));
      border: 12px solid #2a2a3a;
      border-radius: 44px;
    }

    /* TABLET MODE (820 x 1180) */
    .device-bezel[data-device="tablet"] {
      width: 852px;
      height: min(1120px, calc(100vh - 92px));
      border: 16px solid #2a2a3a;
      border-radius: 36px;
    }

    /* DESKTOP MODE (1440 / Full Width) */
    .device-bezel[data-device="desktop"] {
      width: min(1460px, calc(100vw - 48px));
      height: calc(100vh - 92px);
      border: 10px solid #1e1e2e;
      border-radius: 18px;
    }

    /* Side hardware buttons on Tablet/Mobile */
    .device-bezel::before {
      content: '';
      position: absolute;
      left: -19px;
      top: 120px;
      width: 3px;
      height: 50px;
      background: #3f3f4e;
      border-radius: 2px 0 0 2px;
    }

    .device-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    /* QR Modal */
    .qr-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 80, 0.55);
      backdrop-filter: blur(8px);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .qr-modal.open {
      display: flex;
    }
    .qr-card {
      background: #111120;
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 28px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 25px 60px rgba(0,0,80,0.5);
    }
    .qr-card h3 {
      font-size: 1.05rem;
      margin-bottom: 6px;
      color: #fff;
    }
    .qr-card p {
      font-size: 0.82rem;
      color: #a1a1aa;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .qr-img-wrap {
      background: #ffffff;
      padding: 14px;
      border-radius: 14px;
      display: inline-block;
      margin-bottom: 16px;
    }
    .qr-close-btn {
      background: #000050;
      color: #B1FD43;
      border: 1px solid rgba(177, 253, 67, 0.3);
      padding: 8px 20px;
      border-radius: 99px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
    }

    /* Toast notification */
    .stitch-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #B1FD43;
      color: #000050;
      padding: 8px 18px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(177, 253, 67, 0.3);
    }
    .stitch-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      .stitch-dim-badge { display: none; }
      .stitch-logo-text { font-size: 1rem; }
      .stitch-beta-badge { display: none; }
    }
  </style>
</head>

  <!-- TOAST -->

  <script>
    (function() {
      const bezel = document.getElementById('device-bezel');
      const iframe = document.getElementById('preview-iframe');
      const dropdown = document.getElementById('page-dropdown');
      const dropdownBtn = document.getElementById('page-dropdown-btn');
      const dropdownMenu = document.getElementById('page-dropdown-menu');
      const dropdownCurrent = document.getElementById('page-dropdown-current');
      const dimLabel = document.getElementById('dim-label');
      const modeBtns = document.querySelectorAll('.stitch-icon-btn[data-mode]');
      const toast = document.getElementById('stitch-toast');

      let currentPageValue = '/';

      const LABELS = {
        mobile: 'Mobile • 390px',
        tablet: 'Tablet • 820px',
        desktop: 'Desktop • 1440px'
      };

      const LINK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>';

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function syncDropdownUI(val) {
        currentPageValue = val;
        let items = Array.from(dropdownMenu.querySelectorAll('.stitch-dropdown__item'));
        let match = items.find(btn => btn.getAttribute('data-value') === val);
        if (!match) {
          match = document.createElement('button');
          match.type = 'button';
          match.className = 'stitch-dropdown__item';
          match.setAttribute('data-value', val);
          match.innerHTML = LINK_SVG + '<span>' + val + '</span>';
          match.addEventListener('click', () => {
            dropdown.classList.remove('open');
            setPage(val);
          });
          dropdownMenu.appendChild(match);
          items.push(match);
        }
        items.forEach(btn => btn.classList.toggle('active', btn === match));
        dropdownCurrent.innerHTML = match.innerHTML;
      }

      function setDevice(mode) {
        if (!LABELS[mode]) mode = 'desktop';
        bezel.setAttribute('data-device', mode);
        dimLabel.textContent = LABELS[mode];
        modeBtns.forEach(b => b.classList.toggle('active', b.getAttribute('data-mode') === mode));
        updateUrlState(currentPageValue, mode);
      }

      function setPage(pageUrl) {
        syncDropdownUI(pageUrl);
        iframe.src = pageUrl;
        updateUrlState(pageUrl, bezel.getAttribute('data-device'));
      }

      function updateUrlState(page, device) {
        const url = new URL(window.location.href);
        url.searchParams.set('page', page);
        url.searchParams.set('device', device);
        window.history.replaceState({}, '', url);
      }

      // Toggle custom dropdown
      dropdownBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });

      document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('open');
        }
      });

      dropdownMenu.querySelectorAll('.stitch-dropdown__item').forEach(btn => {
        btn.addEventListener('click', () => {
          dropdown.classList.remove('open');
          setPage(btn.getAttribute('data-value'));
        });
      });

      // Init from URL params if present, defaulting to page='/' and device='desktop'
      const params = new URLSearchParams(window.location.search);
      const initPage = params.get('page') || '/';
      const initDevice = params.get('device') || 'desktop';

      syncDropdownUI(initPage);
      if (initPage !== '/') {
        iframe.src = initPage;
      }
      setDevice(initDevice);

      // Event listeners
      modeBtns.forEach(btn => {
        btn.addEventListener('click', () => setDevice(btn.getAttribute('data-mode')));
      });

      // Sync dropdown when user clicks links inside the iframe
      iframe.addEventListener('load', () => {
        try {
          const loc = iframe.contentWindow.location;
          let rel = loc.pathname || '/';
          if (rel === '/index.html') rel = '/';
          const fullRel = rel + (loc.search || '');
          let found = Array.from(dropdownMenu.querySelectorAll('.stitch-dropdown__item')).some(btn => btn.getAttribute('data-value') === fullRel);
          if (found) {
            syncDropdownUI(fullRel);
          } else {
            currentPageValue = fullRel;
          }
          updateUrlState(fullRel, bezel.getAttribute('data-device'));
        } catch (e) {
          // Cross-origin fallback
        }
      });

      // Open current page in new tab
      document.getElementById('btn-open-tab').addEventListener('click', () => {
        try {
          window.open(iframe.contentWindow.location.href, '_blank');
        } catch (e) {
          window.open(iframe.src, '_blank');
        }
      });

      // Refresh iframe
      document.getElementById('btn-refresh').addEventListener('click', () => {
        try {
          iframe.contentWindow.location.reload();
        } catch (e) {
          iframe.src = iframe.src;
        }
        showToast('Page reloaded!');
      });

      // QR Code modal
      document.getElementById('btn-qr').addEventListener('click', () => {
        let targetUrl = window.location.origin + currentPageValue;
        try {
          targetUrl = iframe.contentWindow.location.href;
        } catch (e) {}
        const qrImg = document.getElementById('qr-img');
        qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(targetUrl);
        document.getElementById('qr-modal').classList.add('open');
      });

      // Share button
      document.getElementById('btn-share').addEventListener('click', () => {
        navigator.clipboard.writeText(window.location.href).then(() => {
          showToast('Preview link copied!');
        });
      });
    })();
  </script>
</body>
</html>
